[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imgdata"
version = "0.0.1"
description = "Modular core for structured image parsing."
authors = [
  { name = "你的名字", email = "you@example.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[tool.setuptools]
packages = ["imgdata.core"]
package-dir = { "imgdata.core" = "core" }
